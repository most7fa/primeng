<p-toast></p-toast>

<div class="flex justify-between">
  <div class="flex flex-wrap items-center gap-3">
    <p-fileUpload
      #fu
      mode="basic"
      chooseLabel="Choose"
      name="demo[]"
      url="https://www.primefaces.org/cdn/api/upload.php"
      accept="image/*"
      [multiple]="true"
      [maxFileSize]="1000000"
      (onUpload)="onUpload($event)">
    </p-fileUpload>
  </div>

  <button
    pButton
    type="button"
    severity="secondary"
    (click)="fu.upload()">
    Upload
  </button>
</div>
