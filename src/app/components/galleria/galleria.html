<p-galleria
    [value]="images"
    [responsiveOptions]="responsiveOptions"
    [numVisible]="5"
    [circular]="true"
    [showItemNavigators]="true"
    [showThumbnails]="true"
    [containerStyle]="{ 'max-width': '700px', margin: '0 auto' }">

    <ng-template #item let-item>
        <img
            [src]="item.itemImageSrc"
            [alt]="item.alt"
            style="width:100%;display:block" />
    </ng-template>

    <ng-template #thumbnail let-item>
        <img
            [src]="item.thumbnailImageSrc"
            [alt]="item.alt"
            style="display:block" />
    </ng-template>

</p-galleria>
