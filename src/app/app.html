<div class="flex flex-col items-center gap-4">
    <svg [pIcon]="selectedIcon()" [size]="32"></svg>

    <div class="flex gap-2">
        @for (icon of icons; track icon) {
            <p-button
                [text]="selectedIcon() !== icon"
                severity="secondary"
                (onClick)="selectedIcon.set(icon)">

                <svg [pIcon]="icon"></svg>

            </p-button>
        }
    </div>
</div>
