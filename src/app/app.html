<div class="flex items-center justify-center">
  <div class="flex flex-col gap-3">

    <div class="flex items-center gap-3">
      <p-radiobutton
        inputId="ingredient-strawberry"
        name="fruit"
        value="strawberry"
        [(ngModel)]="ingredient">
      </p-radiobutton>

      <label for="ingredient-strawberry">🍓 Strawberry</label>
    </div>

    <div class="flex items-center gap-3">
      <p-radiobutton
        inputId="ingredient-banana"
        name="fruit"
        value="banana"
        [(ngModel)]="ingredient">
      </p-radiobutton>

      <label for="ingredient-banana">🍌 Banana</label>
    </div>

    <div class="flex items-center gap-3">
      <p-radiobutton
        inputId="ingredient-watermelon"
        name="fruit"
        value="watermelon"
        [(ngModel)]="ingredient">
      </p-radiobutton>

      <label for="ingredient-watermelon">🍉 Watermelon</label>
    </div>

  </div>
</div>
